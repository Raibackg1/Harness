apiVersion: v1
kind: ConfigMap
metadata:
  name: harness-config
data:
  NODE_ENV: production
  PORT: "3000"
  KUBERNETES_ENABLED: "true"
  APP_ORIGIN: https://cloud.example.com
  # MUST be a different registrable domain from the control plane.
  WORKSPACE_DOMAIN: workspaces.example.net
  WORKSPACE_IMAGE: ghcr.io/YOUR-ORG/harness-workspace@sha256:REPLACE_WITH_VERIFIED_IMAGE_DIGEST
  RUNTIME_CLASS: gvisor
  STORAGE_CLASS: REPLACE_WITH_CSI_CLASS
  INGRESS_CLASS: nginx
  TLS_ISSUER: letsencrypt-prod
  MAX_PROJECTS: "10"
  MAX_RUNNING_PER_USER: "2"
  MAX_RUNNING_TOTAL: "20"
  MAX_RUNTIME_MINUTES: "120"
  PLATFORM_NAMESPACE: harness-system
  INGRESS_NAMESPACE: ingress-nginx
# harness-secrets is intentionally NOT in Git. Create it from a protected file or an ExternalSecret.
# Required keys: DATABASE_URL, ENCRYPTION_KEY, BOOTSTRAP_TOKEN.
