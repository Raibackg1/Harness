apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: harness-system
resources:
  - namespace.yaml
  - config.yaml
  - rbac.yaml
  - admission.yaml
  - control-plane.yaml
  - networking.yaml
  - availability.yaml
images:
  # Replace with your registry and immutable, scanned image digest.
  - name: harness-control
    newName: ghcr.io/YOUR-ORG/harness-control
    digest: sha256:REPLACE_WITH_VERIFIED_IMAGE_DIGEST
