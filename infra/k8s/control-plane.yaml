apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: harness-api }
  template:
    metadata:
      labels: { app: harness-api }
    spec:
      serviceAccountName: harness-api
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: harness-api }
      containers:
        - name: api
          image: harness-control
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef: { name: harness-config }
            - secretRef: { name: harness-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-worker
spec:
  replicas: 1
  strategy: { type: Recreate }
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: harness-worker }
  template:
    metadata:
      labels: { app: harness-worker }
    spec:
      serviceAccountName: harness-worker
      terminationGracePeriodSeconds: 180
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: harness-control
          command: [node, build/server/worker-entry.js]
          envFrom:
            - configMapRef: { name: harness-config }
            - secretRef: { name: harness-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 256Mi }
