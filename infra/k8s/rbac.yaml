apiVersion: v1
kind: ServiceAccount
metadata:
  name: harness-api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harness-worker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: harness-api-observer
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get"]
  # Read-only: lets the dashboard verify the admission boundary that limits the worker role.
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["get"]
  - nonResourceURLs: ["/version"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: harness-api-observer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: harness-api-observer
subjects:
  - kind: ServiceAccount
    name: harness-api
    namespace: harness-system
---
# Dynamic namespaces require cluster-scoped permissions. The admission policies below
# are mandatory to restrict mutations to hc-* namespaces. Do not install this role alone.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: harness-workspace-provisioner
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources:
      [
        "services",
        "persistentvolumeclaims",
        "resourcequotas",
        "limitranges",
        "configmaps",
        "secrets",
      ]
    verbs: ["create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["create", "patch", "delete"]
  # Read-only self-check at startup. Never grant write access to admission resources:
  # the worker must not be able to relax the policies that contain its own role.
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: harness-workspace-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: harness-workspace-provisioner
subjects:
  - kind: ServiceAccount
    name: harness-worker
    namespace: harness-system
