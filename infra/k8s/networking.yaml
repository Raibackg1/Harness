apiVersion: v1
kind: Service
metadata:
  name: harness-api
spec:
  selector: { app: harness-api }
  ports:
    - { name: http, port: 3000, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harness-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    # Defense in depth. Tune at the trusted edge; forwarded client IPs are not trusted by the API.
    nginx.ingress.kubernetes.io/limit-rps: "10"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [cloud.example.com]
      secretName: harness-control-tls
  rules:
    - host: cloud.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: harness-api
                port: { number: 3000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-plane-isolation
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { protocol: TCP, port: 3000 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Tailor to your actual API-server and PostgreSQL endpoints. Some CNIs evaluate
    # pre-DNAT ports, so verify the API-server's real target port (often 6443).
    - ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
        - { protocol: TCP, port: 5432 }
